<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar música | Minhas Músicas</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <main class="pagina-formulario">
        <a href="index.html">Voltar para a lista</a>
        <h1>Cadastrar música</h1>
        <p id="mensagem" class="mensagem" role="status"></p>
        <div class="campos">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" maxlength="100">

            <label for="artista">Artista</label>
            <input type="text" id="artista" maxlength="100">

            <label for="genero">Gênero</label>
            <input type="text" id="genero" maxlength="50">

            <label for="ano">Ano</label>
            <input type="number" id="ano" min="1" step="1">

            <label for="duracao">Duração em minutos</label>
            <input type="number" id="duracao" min="1" step="1">
        </div>
        <button id="botaoCadastrar" type="button">Cadastrar</button>
    </main>
    <script src="cadastrar.js"></script>
</body>
</html>
